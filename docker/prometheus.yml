global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'stud-reg-system'
    environment: 'docker-compose'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
  # Alert rules evaluation
  alert_relabel_configs: []

rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    scrape_timeout: 10s

  # Backend API metrics - PRIMARY (prom-client)
  - job_name: 'backend-api'
    honor_timestamps: true
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'api-server'
          environment: 'docker'
    scrape_interval: 15s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # Frontend health check
  - job_name: 'frontend'
    metrics_path: '/'
    scheme: http
    static_configs:
      - targets: ['frontend:8080']
        labels:
          service: 'web-ui'
          environment: 'docker'
    scrape_interval: 30s
    scrape_timeout: 5s
