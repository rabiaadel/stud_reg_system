apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stud-reg-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/stud-reg-system.git
    targetRevision: main
    path: k8s/monitoring
    plugin:
      name: kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
