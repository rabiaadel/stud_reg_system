apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stud-reg-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/stud-reg-system.git
    targetRevision: main
    path: k8s
    plugin:
      name: kustomize
      env:
        - name: KUSTOMIZE_ENABLE_ALPHA_COMMANDS
          value: "true"
        - name: KUSTOMIZE_ENABLE_ALPHA_PLUGINS
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
