apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: backend

namespace: stud-reg-system

commonLabels:
  app: backend
  component: api-server

resources:
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

replicas:
- name: backend
  count: 3

generatorOptions:
  disableNameSuffixHash: false

secretGenerator:
- name: backend-secret
  behavior: merge
  envs:
  - secret.env

configMapGenerator:
- name: backend-config
  behavior: merge
