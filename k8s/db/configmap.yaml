apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: stud-reg-db
data:
  POSTGRES_DB: student_registration_system
  POSTGRES_INITDB_ARGS: "-c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB -c maintenance_work_mem=64MB -c work_mem=4MB"
  postgresql.conf: |
    # PostgreSQL Configuration
    max_connections = 200
    shared_buffers = 256MB
    effective_cache_size = 1GB
    maintenance_work_mem = 64MB
    work_mem = 4MB
    wal_buffers = 16MB
    checkpoint_completion_target = 0.9
    wal_level = minimal
    max_wal_senders = 0
    random_page_cost = 1.1
    effective_io_concurrency = 200
