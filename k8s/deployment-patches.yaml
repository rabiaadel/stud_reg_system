apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  template:
    spec:
      containers:
      - name: backend
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend

spec:
  template:
    spec:
      containers:
      - name: frontend
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
