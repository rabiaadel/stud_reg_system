apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: frontend

namespace: stud-reg-system

commonLabels:
  app: frontend
  component: web-ui

resources:
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

replicas:
- name: frontend
  count: 2
