# Kustomize build configuration for local development

resources:
  - ../k8s

# Namespace override for local development
namespace: default

namePrefix: local-

replicas:
- name: backend
  count: 1
- name: frontend
  count: 1

# Patches for development
patchesStrategicMerge:
  - patch-local.yaml

# Config maps for development
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug

# Secrets for development
secretGenerator:
  - name: backend-secret
    behavior: merge
    envs:
      - secret-dev.env
