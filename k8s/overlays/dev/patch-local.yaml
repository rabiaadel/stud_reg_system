apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
namespace: stud-reg-system

spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
